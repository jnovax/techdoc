services:
  database:
    image: postgres:18.6-alpine
    environment:
      - POSTGRES_USER=techdoc
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=techdoc
    volumes:
      - ./data/database:/var/lib/postgresql
    restart: always

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: techdoc-app:latest
    environment:
      - CMD_DB_URL=postgres://techdoc:password@database:5432/techdoc
      - CMD_DOMAIN=localhost
      - CMD_URL_ADDPORT=true
      - CMD_PORT=3000
      - CMD_TOOBUSY_LAG=10000
      - CMD_SESSION_SECRET=3b435609ac22c2926a934aec7a532ad1cb9df0f2e6a27d8f552205a0147e52a5
      - CMD_VIEW_CACHE=false
    volumes:
      - ./data/uploads:/home/node/app/public/uploads
      - techdoc_static:/home/node/app/public/build
    restart: always
    depends_on:
      - database

  web:
    image: nginx:1.27-alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/public:/var/www/techdoc/public:ro
      - ./data/uploads:/var/www/techdoc/public/uploads:ro
      - techdoc_static:/var/www/techdoc/public/build:ro
    restart: always
    depends_on:
      - app

volumes:
  techdoc_static:
