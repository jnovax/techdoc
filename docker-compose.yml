# Lưu ý: Nếu database ./data/database đã khởi tạo trước đó với user hedgedoc,
# bạn có thể chuyển đổi role bằng lệnh:
# docker compose exec database psql -U hedgedoc -c "CREATE USER techdoc WITH SUPERUSER PASSWORD 'password'; CREATE DATABASE techdoc OWNER techdoc;"
services:
  database:
    image: postgres:18.6-alpine
    environment:
      - POSTGRES_USER=techdoc
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=techdoc
    volumes:
      - ./data/database:/var/lib/postgresql
    restart: always
  app:
    build: ./app
    image: techdoc-local:latest
    environment:
      - CMD_DB_URL=postgres://techdoc:password@database:5432/techdoc
      - CMD_DOMAIN=localhost
      - CMD_URL_ADDPORT=true
      - CMD_TOOBUSY_LAG=10000
      - CMD_SESSION_SECRET=3b435609ac22c2926a934aec7a532ad1cb9df0f2e6a27d8f552205a0147e52a5
    volumes:
      - ./app/lib:/hedgedoc/lib:ro
      - ./app/public:/hedgedoc/public
      - ./data/uploads:/hedgedoc/public/uploads
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - database
