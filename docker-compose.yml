services:
  database:
    image: postgres:18.6-alpine
    environment:
      - POSTGRES_USER=hedgedoc
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=hedgedoc
    volumes:
      - ./data/database:/var/lib/postgresql
    restart: always
  app:
    build: ./hedgedoc
    image: hedgedoc-local:latest
    environment:
      - CMD_DB_URL=postgres://hedgedoc:password@database:5432/hedgedoc
      - CMD_DOMAIN=localhost
      - CMD_URL_ADDPORT=true
      - CMD_TOOBUSY_LAG=10000
      - CMD_SESSION_SECRET=3b435609ac22c2926a934aec7a532ad1cb9df0f2e6a27d8f552205a0147e52a5
    volumes:
      - ./hedgedoc/lib:/hedgedoc/lib:ro
      - ./hedgedoc/public:/hedgedoc/public
      - ./data/uploads:/hedgedoc/public/uploads
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - database
