<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="primaryGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadowDark" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(35, 25)">
    <!-- Document Base -->
    <rect x="0" y="0" width="115" height="150" rx="16" fill="url(#primaryGradDark)" filter="url(#shadowDark)" />
    <!-- Page Fold / Accent Line -->
    <path d="M 75 0 L 115 40 L 75 40 Z" fill="#7dd3fc" opacity="0.6" />
    <path d="M 75 0 L 115 40 L 85 40 A 10 10 0 0 1 75 30 Z" fill="#bae6fd" />
    <!-- Code Brackets & Document Lines -->
    <path d="M 38 65 L 26 78 L 38 91" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 77 65 L 89 78 L 77 91" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="62" y1="62" x2="53" y2="94" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <line x1="30" y1="112" x2="85" y2="112" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9" />
    <line x1="30" y1="126" x2="68" y2="126" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(185, 128)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="94" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">Tech<tspan fill="#38bdf8">Doc</tspan></text>
  </g>
</svg>
