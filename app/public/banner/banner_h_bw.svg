<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(35, 25)">
    <!-- Document Base -->
    <rect x="0" y="0" width="115" height="150" rx="16" fill="url(#primaryGrad)" filter="url(#shadow)" />
    <!-- Page Fold / Accent Line -->
    <path d="M 75 0 L 115 40 L 75 40 Z" fill="#60a5fa" opacity="0.6" />
    <path d="M 75 0 L 115 40 L 85 40 A 10 10 0 0 1 75 30 Z" fill="#93c5fd" />
    <!-- Code Brackets & Document Lines -->
    <path d="M 38 65 L 26 78 L 38 91" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 77 65 L 89 78 L 77 91" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="62" y1="62" x2="53" y2="94" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <line x1="30" y1="112" x2="85" y2="112" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.75" />
    <line x1="30" y1="126" x2="68" y2="126" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(185, 128)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="94" font-weight="800" fill="#0f172a" letter-spacing="-1.5">Tech<tspan fill="#2563eb">Doc</tspan></text>
  </g>
</svg>
