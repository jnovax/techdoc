<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="vertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="vertShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(145, 60)">
    <!-- Document Base -->
    <rect x="0" y="0" width="210" height="270" rx="28" fill="url(#vertGrad)" filter="url(#vertShadow)" />
    <!-- Page Fold / Accent Line -->
    <path d="M 140 0 L 210 70 L 140 70 Z" fill="#60a5fa" opacity="0.6" />
    <path d="M 140 0 L 210 70 L 158 70 A 18 18 0 0 1 140 52 Z" fill="#93c5fd" />
    <!-- Code Brackets & Document Lines -->
    <path d="M 68 115 L 48 140 L 68 165" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 142 115 L 162 140 L 142 165" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="114" y1="110" x2="96" y2="170" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />
    <line x1="50" y1="205" x2="160" y2="205" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.75" />
    <line x1="50" y1="230" x2="125" y2="230" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(250, 400)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#0f172a" letter-spacing="-1">Tech<tspan fill="#2563eb">Doc</tspan></text>
  </g>
  <g transform="translate(250, 440)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#64748b" letter-spacing="1.5">TÀI LIỆU &amp; GHI CHÚ</text>
  </g>
</svg>
